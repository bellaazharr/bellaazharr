  @keyframes scan { 0% { transform: translateY(-80px) } 100% { transform: translateY(380px) } }
  .scan { animation: scan 5s linear infinite; }
  @keyframes gl1 { 0%,91%,100% { transform: translate(0,0); opacity:0 } 92% { transform: translate(-6px,2px); opacity:.8 } 94% { transform: translate(5px,-2px); opacity:.8 } 96% { transform: translate(0,0); opacity:0 } }
  @keyframes gl2 { 0%,91%,100% { transform: translate(0,0); opacity:0 } 92% { transform: translate(6px,-2px); opacity:.8 } 94% { transform: translate(-4px,2px); opacity:.8 } 96% { transform: translate(0,0); opacity:0 } }
  .g1 { animation: gl1 6s infinite steps(1); } .g2 { animation: gl2 6s infinite steps(1); }
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  .blink { animation: blink 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
  .pulse { animation: pulse 2.4s infinite; }
</style>
